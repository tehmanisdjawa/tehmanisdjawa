<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kasir — Es Teh Djawa</title>
<style>
  :root{
    --ink:#241a10;
    --paper:#faf5ea;
    --card:#ffffff;
    --teh:#8a5a2b;
    --teh-dark:#5e3c1c;
    --daun:#4c6b3f;
    --daun-light:#e7efe1;
    --jeruk:#c9791e;
    --jeruk-light:#fbead3;
    --merah:#b3432b;
    --merah-light:#f7e2dc;
    --line:#e8ddc8;
    --muted:#8a7c66;
    --radius:14px;
    --shadow:0 4px 16px rgba(60,40,15,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
    overscroll-behavior-y:none;
  }

  /* ===== TOPBAR ===== */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--teh-dark); color:#fff4e2;
    padding:14px 16px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.14);
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brandLeft{display:flex; align-items:center; gap:10px;}
  .brandLeft svg{width:26px;height:26px;flex:0 0 auto;}
  .brandLeft h1{font-size:16.5px; margin:0; font-weight:700;}
  .brandLeft .sub{font-size:11px; opacity:.75; margin-top:1px;}
  .clock{font-size:12px; opacity:.85; text-align:right; font-variant-numeric:tabular-nums;}

  .searchWrap{padding:12px 16px 0; display:flex; gap:8px;}
  .searchWrap input{
    flex:1; padding:10px 14px; border-radius:11px; border:1.5px solid rgba(255,244,226,.25);
    background:rgba(255,244,226,.1); font-size:14px; color:#fff4e2;
  }
  .searchWrap input::placeholder{color:rgba(255,244,226,.55);}
  .searchWrap input:focus{outline:none; border-color:#fff4e2;}

  .catTabs{display:flex; gap:7px; overflow-x:auto; padding:11px 16px 12px; scrollbar-width:none;}
  .catTabs::-webkit-scrollbar{display:none;}
  .catTabs button{
    flex:0 0 auto; padding:6px 13px; border-radius:999px; border:1.3px solid rgba(255,244,226,.3);
    background:transparent; font-size:12.5px; font-weight:600; color:#f4e5cc; cursor:pointer; white-space:nowrap;
  }
  .catTabs button.active{background:#fff4e2; border-color:#fff4e2; color:var(--teh-dark);}

  /* ===== MENU LIST ===== */
  .catLabel{
    font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.6px; margin:16px 16px 6px;
  }
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:0 16px;
  }
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; cursor:pointer; transition:transform .1s, box-shadow .1s;
    display:flex; flex-direction:column; gap:6px; position:relative; min-height:92px;
  }
  .item:active{transform:scale(.97);}
  .item .name{font-size:13.5px; font-weight:650; line-height:1.28;}
  .item .price{font-size:12px; color:var(--muted); margin-top:auto;}
  .item .varCount{font-size:10.5px; color:var(--teh); font-weight:600;}
  .item .qtyDot{
    position:absolute; top:8px; right:8px; min-width:20px; height:20px; padding:0 5px;
    background:var(--daun); color:#fff; border-radius:999px; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  .empty{padding:50px 20px; text-align:center; color:var(--muted); font-size:14px;}

  /* ===== VARIANT PICKER SHEET ===== */
  .sheetOverlay{
    position:fixed; inset:0; background:rgba(30,20,10,.45); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheetOverlay.show{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    max-height:82vh; display:flex; flex-direction:column; overflow:hidden;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheetHead{padding:16px 18px 6px; display:flex; align-items:flex-start; justify-content:space-between;}
  .sheetHead .ttl{font-size:16.5px; font-weight:700;}
  .sheetHead .cat{font-size:12px; color:var(--muted); margin-top:1px;}
  .sheetHead button{background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer; padding:2px;}
  .sheetBody{overflow-y:auto; padding:6px 18px 6px;}

  .varOption{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:9px;
    cursor:pointer; transition:.12s;
  }
  .varOption:active{transform:scale(.98);}
  .varOption .vn{font-size:14px; font-weight:600;}
  .varOption .vp{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .varOption .plusBtn{
    width:34px; height:34px; border-radius:10px; background:var(--daun-light); color:var(--daun);
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; flex:0 0 auto;
  }

  .qtyStepBar{
    display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:11px; overflow:hidden; flex:0 0 auto;
  }
  .qtyStepBar button{width:34px; height:34px; border:none; background:var(--paper); font-size:19px; font-weight:700; color:var(--teh); cursor:pointer;}
  .qtyStepBar .val{width:30px; text-align:center; font-size:14px; font-weight:700;}

  .sheetFootPad{height:8px;}

  /* ===== CART ===== */
  .cartOverlay{
    position:fixed; inset:0; background:rgba(30,20,10,.45); z-index:55;
    display:none; align-items:flex-end; justify-content:center;
  }
  .cartOverlay.show{display:flex;}
  .cartSheet{
    background:var(--paper); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    max-height:88vh; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .2s ease;
  }
  .cartHead{padding:16px 18px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line);}
  .cartHead h2{font-size:16px; margin:0;}
  .cartHead button{background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer;}
  .cartBody{overflow-y:auto; padding:8px 18px;}

  .cartRow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
  .cartRow .ci{flex:1; min-width:0;}
  .cartRow .cn{font-size:13.5px; font-weight:600; line-height:1.3;}
  .cartRow .cv{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .cartRow .cp{font-size:12px; color:var(--teh); font-weight:600; margin-top:2px;}
  .cartRow .cstep{display:flex; align-items:center; border:1.4px solid var(--line); border-radius:9px; overflow:hidden; flex:0 0 auto;}
  .cartRow .cstep button{width:28px; height:28px; border:none; background:var(--paper); font-size:16px; font-weight:700; color:var(--teh); cursor:pointer;}
  .cartRow .cstep .cval{width:26px; text-align:center; font-size:13px; font-weight:700;}
  .cartRow .cdel{background:none; border:none; color:var(--merah); font-size:16px; cursor:pointer; padding:4px;}

  .payWrap{padding:14px 18px 4px;}
  .payLabel{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
  .payTabs{display:flex; gap:8px;}
  .payTabs button{
    flex:1; padding:11px 6px; border-radius:11px; border:1.5px solid var(--line); background:var(--card);
    font-size:13px; font-weight:650; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .payTabs button.active{background:var(--teh-dark); border-color:var(--teh-dark); color:#fff4e2;}
  .payTabs button svg{width:15px;height:15px;}

  .nameWrap{padding:12px 18px 4px;}
  .nameWrap input{
    width:100%; padding:11px 14px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--card); font-size:14px; color:var(--ink);
  }
  .nameWrap input:focus{outline:none; border-color:var(--teh);}

  .totalBar{padding:14px 18px 4px; display:flex; align-items:baseline; justify-content:space-between;}
  .totalBar .tl{font-size:13px; color:var(--muted); font-weight:600;}
  .totalBar .tv{font-size:22px; font-weight:700; color:var(--ink);}

  .cartFoot{padding:14px 18px 18px;}
  .checkoutBtn{
    width:100%; background:var(--daun); color:#fff; border:none; border-radius:12px;
    padding:15px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .checkoutBtn[disabled]{opacity:.5;}
  .cartEmpty{padding:50px 20px; text-align:center; color:var(--muted); font-size:14px;}

  /* ===== FAB ===== */
  .fab{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:40;
    background:var(--teh-dark); color:#fff4e2; border:none; border-radius:14px;
    padding:15px 18px; font-size:15px; font-weight:700; box-shadow:var(--shadow), 0 6px 20px rgba(0,0,0,.22);
    display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;
  }
  .fab .fabLeft{display:flex; align-items:center; gap:9px;}
  .fab .badge{background:#fff4e2; color:var(--teh-dark); border-radius:999px; min-width:24px; height:24px; padding:0 7px; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .fab .fabTotal{font-variant-numeric:tabular-nums;}
  .fab[disabled]{opacity:0; pointer-events:none;}

  /* ===== TOAST ===== */
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-70px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:11px; font-size:13.5px;
    z-index:70; transition:transform .28s ease; box-shadow:0 8px 22px rgba(0,0,0,.28);
    max-width:88%; text-align:center; display:flex; align-items:center; gap:8px;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;flex:0 0 auto;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brandrow">
    <div class="brandLeft">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 15C4 8 9 4 20 4C20 13 15 20 8 20C6.5 20 5 19.5 4 18.5" stroke="#f4e9d6" stroke-width="1.6" stroke-linecap="round"/><path d="M6 17C10 13 14 10 18 6" stroke="#f4e9d6" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>
        <h1>Kasir Es Teh Djawa</h1>
        <div class="sub">Pontir 1</div>
      </div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="searchWrap">
    <input id="searchBox" type="text" placeholder="Cari menu...">
  </div>
  <div class="catTabs" id="catTabs"></div>
</div>

<div id="menuArea"></div>

<button class="fab" id="fab" disabled>
  <span class="fabLeft">
    <span class="badge" id="fabBadge">0</span>
    Lihat Keranjang
  </span>
  <span class="fabTotal" id="fabTotal">Rp0</span>
</button>

<!-- Variant picker -->
<div class="sheetOverlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheetHead">
      <div>
        <div class="ttl" id="sheetTitle">Menu</div>
        <div class="cat" id="sheetCat">Kategori</div>
      </div>
      <button id="sheetClose">✕</button>
    </div>
    <div class="sheetBody" id="sheetBody"></div>
    <div class="sheetFootPad"></div>
  </div>
</div>

<!-- Cart -->
<div class="cartOverlay" id="cartOverlay">
  <div class="cartSheet">
    <div class="cartHead">
      <h2>Keranjang Pesanan</h2>
      <button id="cartClose">✕</button>
    </div>
    <div class="cartBody" id="cartBody"></div>
    <div class="payWrap">
      <div class="payLabel">Metode Bayar</div>
      <div class="payTabs" id="payTabs">
        <button data-pay="Cash" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
          Cash
        </button>
        <button data-pay="QRIS">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v.01"/></svg>
          QRIS
        </button>
      </div>
    </div>
    <div class="nameWrap">
      <input id="karyawanName" type="text" placeholder="Nama karyawan (wajib)">
    </div>
    <div class="totalBar">
      <span class="tl">Total Belanja</span>
      <span class="tv" id="cartTotal">Rp0</span>
    </div>
    <div class="cartFoot">
      <button class="checkoutBtn" id="checkoutBtn">Selesai & Kirim Pesanan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZzIc_5_ljPvtEv-JGYXyLJfaAzpABgZHL_0T087VLJhVmSilqz4wUeqsPl1jZYBsj/exec";

let MENU = [];
let activeCat = "Semua";
let cart = {}; // key -> {nama, varian, harga, kategori, qty}
let payMethod = "Cash";

const el = id => document.getElementById(id);
const rupiah = n => "Rp" + Number(n).toLocaleString('id-ID');

async function loadMenu(){
  try{
    const res = await fetch('menu_min.json');
    MENU = await res.json();
  }catch(e){
    el('menuArea').innerHTML = '<div class="empty">Gagal memuat menu (menu_min.json). Pastikan file ada satu folder dengan index.html.</div>';
    return;
  }
  renderCatTabs();
  renderMenu();
}

function renderCatTabs(){
  const tabs = el('catTabs');
  const cats = ["Semua", ...MENU.map(c=>c.kategori)];
  tabs.innerHTML = cats.map(c => `<button data-cat="${c}" class="${c===activeCat?'active':''}">${c}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ activeCat = b.dataset.cat; renderCatTabs(); renderMenu(); };
  });
}

function itemCartQty(ci, ii){
  const item = MENU[ci].items[ii];
  let total = 0;
  item.varian.forEach((v,vi)=>{
    const k = ci+"|"+ii+"|"+vi;
    if(cart[k]) total += cart[k].qty;
  });
  return total;
}

function renderMenu(){
  const q = el('searchBox').value.trim().toLowerCase();
  let html = '';
  MENU.forEach((cat, ci)=>{
    if(activeCat !== "Semua" && cat.kategori !== activeCat) return;
    const items = cat.items.map((it,ii)=>({it,ii})).filter(x => !q || x.it.nama.toLowerCase().includes(q));
    if(items.length===0) return;
    html += `<div class="catLabel">${cat.kategori}</div><div class="grid">`;
    items.forEach(({it,ii})=>{
      const qty = itemCartQty(ci,ii);
      const priceLabel = it.varian.length>1
        ? `Rp${Math.min(...it.varian.map(v=>v.harga||0)).toLocaleString('id-ID')}+`
        : `Rp${(it.varian[0].harga||0).toLocaleString('id-ID')}`;
      html += `<div class="item" data-ci="${ci}" data-ii="${ii}">
        ${qty>0 ? `<div class="qtyDot">${qty}</div>` : ''}
        <div class="name">${it.nama}</div>
        ${it.varian.length>1 ? `<div class="varCount">${it.varian.length} pilihan</div>` : ''}
        <div class="price">${priceLabel}</div>
      </div>`;
    });
    html += `</div>`;
  });
  el('menuArea').innerHTML = html || '<div class="empty">Menu tidak ditemukan.</div>';
  el('menuArea').querySelectorAll('.item').forEach(card=>{
    card.onclick = ()=> openVariantSheet(+card.dataset.ci, +card.dataset.ii);
  });
}

function openVariantSheet(ci, ii){
  const cat = MENU[ci];
  const item = cat.items[ii];
  el('sheetTitle').textContent = item.nama;
  el('sheetCat').textContent = cat.kategori;

  if(item.varian.length === 1){
    // single variant: langsung tambah 1, sheet tampil qty stepper
  }

  el('sheetBody').innerHTML = item.varian.map((v, vi)=>{
    const k = ci+"|"+ii+"|"+vi;
    const qty = cart[k]?.qty || 0;
    if(qty > 0){
      return `<div class="varOption" style="cursor:default;">
        <div>
          <div class="vn">${v.nama}</div>
          <div class="vp">Rp${(v.harga||0).toLocaleString('id-ID')}</div>
        </div>
        <div class="qtyStepBar" data-k="${k}">
          <button class="minus">−</button>
          <div class="val">${qty}</div>
          <button class="plus">+</button>
        </div>
      </div>`;
    }
    return `<div class="varOption" data-k="${k}" data-add="1">
      <div>
        <div class="vn">${v.nama}</div>
        <div class="vp">Rp${(v.harga||0).toLocaleString('id-ID')}</div>
      </div>
      <div class="plusBtn">+</div>
    </div>`;
  }).join('');

  attachSheetEvents(cat, item, ci, ii);
  el('sheetOverlay').classList.add('show');
}

function attachSheetEvents(cat, item, ci, ii){
  el('sheetBody').querySelectorAll('.varOption[data-add]').forEach(row=>{
    row.onclick = ()=>{
      const k = row.dataset.k;
      const vi = +k.split('|')[2];
      const v = item.varian[vi];
      cart[k] = { nama:item.nama, varian:v.nama, harga:v.harga||0, kategori:cat.kategori, qty:1 };
      openVariantSheet(ci, ii);
      renderMenu();
      updateFab();
    };
  });
  el('sheetBody').querySelectorAll('.qtyStepBar').forEach(bar=>{
    const k = bar.dataset.k;
    bar.querySelector('.plus').onclick = ()=>{
      cart[k].qty++;
      openVariantSheet(ci, ii);
      renderMenu();
      updateFab();
    };
    bar.querySelector('.minus').onclick = ()=>{
      cart[k].qty--;
      if(cart[k].qty<=0) delete cart[k];
      openVariantSheet(ci, ii);
      renderMenu();
      updateFab();
    };
  });
}

el('sheetClose').onclick = ()=> el('sheetOverlay').classList.remove('show');
el('sheetOverlay').onclick = (e)=>{ if(e.target.id==='sheetOverlay') el('sheetOverlay').classList.remove('show'); };

el('searchBox').addEventListener('input', renderMenu);

function cartTotalRp(){
  return Object.values(cart).reduce((s,c)=> s + c.qty*c.harga, 0);
}
function cartTotalQty(){
  return Object.values(cart).reduce((s,c)=> s + c.qty, 0);
}

function updateFab(){
  const qty = cartTotalQty();
  const fab = el('fab');
  if(qty===0){ fab.disabled = true; }
  else{
    fab.disabled = false;
    el('fabBadge').textContent = qty;
    el('fabTotal').textContent = rupiah(cartTotalRp());
  }
}

el('fab').onclick = ()=> openCart();

function openCart(){
  renderCartBody();
  el('cartOverlay').classList.add('show');
}

function renderCartBody(){
  const keys = Object.keys(cart);
  if(keys.length===0){
    el('cartBody').innerHTML = '<div class="cartEmpty">Keranjang masih kosong.</div>';
  } else {
    el('cartBody').innerHTML = keys.map(k=>{
      const c = cart[k];
      return `<div class="cartRow" data-k="${k}">
        <div class="ci">
          <div class="cn">${c.nama}</div>
          <div class="cv">${c.varian}</div>
          <div class="cp">${rupiah(c.harga)}</div>
        </div>
        <div class="cstep">
          <button class="cminus">−</button>
          <div class="cval">${c.qty}</div>
          <button class="cplus">+</button>
        </div>
        <button class="cdel">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
        </button>
      </div>`;
    }).join('');
    el('cartBody').querySelectorAll('.cartRow').forEach(row=>{
      const k = row.dataset.k;
      row.querySelector('.cplus').onclick = ()=>{ cart[k].qty++; renderCartBody(); renderMenu(); updateFab(); };
      row.querySelector('.cminus').onclick = ()=>{ cart[k].qty--; if(cart[k].qty<=0) delete cart[k]; renderCartBody(); renderMenu(); updateFab(); };
      row.querySelector('.cdel').onclick = ()=>{ delete cart[k]; renderCartBody(); renderMenu(); updateFab(); };
    });
  }
  el('cartTotal').textContent = rupiah(cartTotalRp());
}

el('cartClose').onclick = ()=> el('cartOverlay').classList.remove('show');
el('cartOverlay').onclick = (e)=>{ if(e.target.id==='cartOverlay') el('cartOverlay').classList.remove('show'); };

el('payTabs').querySelectorAll('button').forEach(b=>{
  b.onclick = ()=>{
    payMethod = b.dataset.pay;
    el('payTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
});

function showToast(msg, ok=true){
  const t = el('toast');
  t.innerHTML = (ok
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.7 3.86a2 2 0 00-3.4 0z"/></svg>'
  ) + '<span>'+msg+'</span>';
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2800);
}

el('checkoutBtn').onclick = async ()=>{
  const nama = el('karyawanName').value.trim();
  if(!nama){ showToast("Isi nama karyawan dulu ya", false); return; }
  const keys = Object.keys(cart);
  if(keys.length===0) return;

  const btn = el('checkoutBtn');
  btn.disabled = true;
  btn.textContent = "Mengirim...";

  const payload = {
    karyawan: nama,
    metodeBayar: payMethod,
    waktu: new Date().toISOString(),
    total: cartTotalRp(),
    items: keys.map(k => ({
      nama: cart[k].nama, varian: cart[k].varian, harga: cart[k].harga,
      qty: cart[k].qty, kategori: cart[k].kategori, subtotal: cart[k].qty*cart[k].harga
    }))
  };

  try{
    if(APPS_SCRIPT_URL.includes("PASTE_URL")){
      showToast("URL Apps Script belum diatur", false);
    } else {
      await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
      showToast("Pesanan terkirim — " + rupiah(payload.total));
    }
    cart = {};
    el('karyawanName').value = '';
    payMethod = 'Cash';
    el('payTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active', x.dataset.pay==='Cash'));
    el('cartOverlay').classList.remove('show');
    renderMenu();
    updateFab();
  }catch(err){
    showToast("Gagal mengirim. Cek koneksi internet.", false);
  }finally{
    btn.disabled = false;
    btn.textContent = "Selesai & Kirim Pesanan";
  }
};

function tickClock(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  el('clock').textContent = hh+":"+mm;
}
tickClock();
setInterval(tickClock, 15000);

loadMenu();
</script>
</body>
</html>
