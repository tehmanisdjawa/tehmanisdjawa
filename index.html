<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Es Teh Djawa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        :root {
            --primary: #7C3AED;
            --primary-dark: #5B21B6;
            --primary-light: #A78BFA;
            --primary-bg: #F5F3FF;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.2s ease;
        }
        body {
            background: var(--gray-50);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #app {
            width: 100%;
            max-width: 1400px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 92vh;
            max-height: 98vh;
        }
        .app-header {
            background: var(--primary);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 700;
            font-size: 20px;
        }
        .app-header .logo span {
            opacity: 0.8;
            font-weight: 400;
            font-size: 14px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .date-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }
        .btn-owner {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }
        .btn-owner:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .product-panel {
            flex: 1;
            padding: 16px 20px 12px 20px;
            overflow-y: auto;
            background: var(--gray-50);
            min-width: 0;
        }
        .category-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: var(--gray-50);
            padding: 4px 0 8px 0;
            z-index: 5;
        }
        .category-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--gray-200);
            background: white;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            user-select: none;
        }
        .category-tab:hover {
            border-color: var(--primary-light);
            color: var(--primary);
        }
        .category-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .product-card {
            background: white;
            border-radius: var(--radius-sm);
            padding: 14px 12px 12px 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--gray-200);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-light);
            box-shadow: var(--shadow);
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .product-card .product-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-800);
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .product-card .product-size {
            font-size: 11px;
            color: var(--gray-400);
            font-weight: 500;
            background: var(--gray-100);
            padding: 1px 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .product-card .product-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
        }
        .product-card .product-price::before {
            content: 'Rp ';
            font-weight: 400;
            font-size: 12px;
            color: var(--gray-400);
        }
        .product-card .product-category-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 9px;
            font-weight: 700;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .cart-panel {
            width: 380px;
            max-width: 42vw;
            background: white;
            border-left: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            min-width: 280px;
        }
        .cart-header {
            padding: 16px 20px 12px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .cart-header h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-header h3 .badge {
            background: var(--primary);
            color: white;
            font-size: 12px;
            padding: 0 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .btn-clear-cart {
            background: none;
            border: none;
            color: var(--gray-400);
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            transition: var(--transition);
        }
        .btn-clear-cart:hover {
            color: #EF4444;
            background: #FEF2F2;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 8px 16px;
        }
        .cart-empty {
            text-align: center;
            color: var(--gray-400);
            padding: 40px 0;
            font-size: 14px;
        }
        .cart-empty .empty-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--gray-50);
            border-radius: var(--radius-xs);
            margin-bottom: 6px;
            border-left: 3px solid var(--primary-light);
        }
        .cart-item .item-info {
            flex: 1;
            min-width: 0;
        }
        .cart-item .item-info .item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-800);
        }
        .cart-item .item-info .item-detail {
            font-size: 12px;
            color: var(--gray-500);
        }
        .cart-item .item-qty {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cart-item .item-qty button {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--gray-200);
            background: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-600);
        }
        .cart-item .item-qty button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .cart-item .item-qty .qty-num {
            font-weight: 700;
            font-size: 15px;
            min-width: 24px;
            text-align: center;
        }
        .cart-item .item-total {
            font-weight: 700;
            font-size: 14px;
            color: var(--gray-800);
            min-width: 60px;
            text-align: right;
        }
        .cart-item .item-total::before {
            content: 'Rp ';
            font-weight: 400;
            font-size: 11px;
            color: var(--gray-400);
        }
        .cart-item .btn-remove-item {
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: var(--transition);
        }
        .cart-item .btn-remove-item:hover {
            color: #EF4444;
        }
        .cart-footer {
            padding: 14px 20px 18px 20px;
            border-top: 1px solid var(--gray-200);
            flex-shrink: 0;
            background: white;
        }
        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .cart-summary .label {
            font-size: 14px;
            color: var(--gray-500);
        }
        .cart-summary .total-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--gray-900);
        }
        .cart-summary .total-price::before {
            content: 'Rp ';
            font-weight: 500;
            font-size: 16px;
            color: var(--gray-400);
        }
        .payment-method {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .payment-method button {
            flex: 1;
            padding: 8px 12px;
            border-radius: var(--radius-xs);
            border: 2px solid var(--gray-200);
            background: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray-600);
        }
        .payment-method button:hover {
            border-color: var(--gray-400);
        }
        .payment-method button.active {
            border-color: var(--primary);
            background: var(--primary-bg);
            color: var(--primary);
        }
        .cart-actions {
            display: flex;
            gap: 10px;
        }
        .cart-actions button {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-checkout {
            background: var(--primary);
            color: white;
        }
        .btn-checkout:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }
        .btn-checkout:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 999;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--gray-900);
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--primary);
        }
        .toast.success {
            border-left-color: #10B981;
        }
        .toast.error {
            border-left-color: #EF4444;
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: white;
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            padding: 24px 28px;
            box-shadow: var(--shadow-lg);
        }
        .modal h2 {
            margin-bottom: 16px;
            font-size: 22px;
        }
        .modal label {
            display: block;
            margin: 12px 0 4px;
            font-weight: 600;
            font-size: 14px;
        }
        .modal input,
        .modal select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-xs);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .modal input:focus,
        .modal select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal .modal-actions button {
            padding: 10px 24px;
            border-radius: var(--radius-xs);
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal .modal-actions .btn-primary {
            background: var(--primary);
            color: white;
        }
        .modal .modal-actions .btn-primary:hover {
            background: var(--primary-dark);
        }
        .modal .modal-actions .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-700);
        }
        .modal .modal-actions .btn-secondary:hover {
            background: var(--gray-300);
        }
        .hidden {
            display: none !important;
        }

        @media (max-width: 820px) {
            .main-layout {
                flex-direction: column;
            }
            .cart-panel {
                width: 100%;
                max-width: 100%;
                border-left: none;
                border-top: 1px solid var(--gray-200);
                min-height: 320px;
                max-height: 50vh;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 8px;
            }
            .product-card {
                padding: 10px 8px;
            }
            .product-card .product-name {
                font-size: 12px;
            }
            .product-card .product-price {
                font-size: 13px;
            }
            .cart-panel {
                min-height: 260px;
                max-height: 44vh;
            }
            .cart-summary .total-price {
                font-size: 18px;
            }
            .payment-method button {
                font-size: 12px;
                padding: 6px 10px;
            }
            .cart-actions button {
                font-size: 13px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">🧋 Es Teh Djawa <span>| Kasir</span></div>
            <div class="header-actions">
                <span class="date-badge" id="dateBadge">📅 --</span>
                <button class="btn-owner" id="btnOwner">🔐 Owner</button>
            </div>
        </header>

        <!-- Main -->
        <div class="main-layout">
            <!-- Product Panel -->
            <div class="product-panel" id="productPanel">
                <div class="category-tabs" id="categoryTabs"></div>
                <div class="product-grid" id="productGrid"></div>
            </div>

            <!-- Cart Panel -->
            <div class="cart-panel">
                <div class="cart-header">
                    <h3>🛒 Keranjang <span class="badge" id="cartCount">0</span></h3>
                    <button class="btn-clear-cart" id="btnClearCart">✕ Kosongkan</button>
                </div>
                <div class="cart-items" id="cartItems">
                    <div class="cart-empty"><span class="empty-icon">🧋</span> Belum ada pesanan.</div>
                </div>
                <div class="cart-footer">
                    <div class="cart-summary">
                        <span class="label">Total</span>
                        <span class="total-price" id="cartTotal">0</span>
                    </div>
                    <div class="payment-method" id="paymentMethod">
                        <button class="active" data-method="Cash">💵 Cash</button>
                        <button data-method="QRIS">📱 QRIS</button>
                        <button data-method="Transfer">🏦 Transfer</button>
                    </div>
                    <div class="cart-actions">
                        <button class="btn-checkout" id="btnCheckout" disabled>✅ Selesai & Kirim</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Owner -->
    <div id="ownerModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>🔐 Tambah Produk Baru</h2>
            <label>Password</label>
            <input type="password" id="ownerPassword" placeholder="Masukkan password owner" />
            <label>Kategori</label>
            <input type="text" id="newCategory" placeholder="Misal: Es Teh Manis" />
            <label>Nama Barang</label>
            <input type="text" id="newName" placeholder="Cup Medium" />
            <label>Size</label>
            <input type="text" id="newSize" placeholder="16oz" />
            <label>Harga</label>
            <input type="number" id="newPrice" placeholder="2000" />
            <label>Stok Awal (opsional)</label>
            <input type="number" id="newStock" placeholder="0" value="0" />
            <div class="modal-actions">
                <button class="btn-secondary" id="modalClose">Batal</button>
                <button class="btn-primary" id="modalSave">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== KONFIGURASI ====================
        // ⚠️ GANTI DENGAN URL WEB APP KAMU
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyZzIc_5_ljPvtEv-JGYXyLJfaAzpABgZHL_0T087VLJhVmSilqz4wUeqsPl1jZYBsj/exec';

        // ==================== STATE ====================
        let products = [];
        let cart = [];
        let paymentMethod = 'Cash';
        let loading = false;

        // ==================== DOM REFS ====================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const categoryTabs = $('#categoryTabs');
        const productGrid = $('#productGrid');
        const cartItems = $('#cartItems');
        const cartCount = $('#cartCount');
        const cartTotal = $('#cartTotal');
        const btnCheckout = $('#btnCheckout');
        const btnClearCart = $('#btnClearCart');
        const paymentMethodEl = $('#paymentMethod');
        const toastContainer = $('#toastContainer');
        const dateBadge = $('#dateBadge');
        const btnOwner = $('#btnOwner');
        const ownerModal = $('#ownerModal');
        const modalClose = $('#modalClose');
        const modalSave = $('#modalSave');
        const ownerPassword = $('#ownerPassword');
        const newCategory = $('#newCategory');
        const newName = $('#newName');
        const newSize = $('#newSize');
        const newPrice = $('#newPrice');
        const newStock = $('#newStock');

        // ==================== HELPERS ====================
        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID').format(num);
        }

        function showToast(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            el.innerHTML = `<span>${icons[type] || 'ℹ️'}</span> ${msg}`;
            toastContainer.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        function getToday() {
            const d = new Date();
            return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        // ==================== API CALLS ====================
        async function apiCall(action, payload = {}) {
            const body = { action, ...payload };
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const json = await res.json();
                return json;
            } catch (err) {
                showToast('❌ Gagal menghubungi server: ' + err.message, 'error');
                return { success: false, message: err.message };
            }
        }

        // ==================== LOAD PRODUCTS ====================
        async function loadProducts() {
            if (loading) return;
            loading = true;
            productGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;">⏳ Memuat produk...</div>';

            try {
                const res = await fetch(`${WEB_APP_URL}?action=getProducts`);
                const json = await res.json();
                if (!json.success) {
                    showToast('❌ Gagal memuat produk: ' + json.message, 'error');
                    products = [];
                } else {
                    products = json.data || [];
                    showToast('✅ ' + products.length + ' produk dimuat', 'success');
                }
            } catch (err) {
                showToast('❌ Gagal memuat produk: ' + err.message, 'error');
                products = [];
            }

            renderCategories();
            filterProducts('all');
            loading = false;
        }

        // ==================== RENDER CATEGORIES ====================
        function renderCategories() {
            const cats = [...new Set(products.map(p => p.kategori).filter(Boolean))].sort();
            categoryTabs.innerHTML = '';
            const allTab = document.createElement('button');
            allTab.className = 'category-tab active';
            allTab.dataset.cat = 'all';
            allTab.textContent = '📦 Semua';
            categoryTabs.appendChild(allTab);

            cats.forEach(cat => {
                const tab = document.createElement('button');
                tab.className = 'category-tab';
                tab.dataset.cat = cat;
                tab.textContent = cat;
                categoryTabs.appendChild(tab);
            });

            categoryTabs.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterProducts(tab.dataset.cat);
                });
            });
        }

        // ==================== FILTER PRODUCTS ====================
        function filterProducts(category) {
            const filtered = category === 'all' ? products : products.filter(p => p.kategori === category);
            productGrid.innerHTML = '';
            if (filtered.length === 0) {
                productGrid.innerHTML =
                    `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray-400);">😕 Tidak ada produk</div>`;
                return;
            }
            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <span class="product-category-badge">${p.kategori}</span>
                    <div class="product-name">${p.nama}</div>
                    <div class="product-size">${p.size}</div>
                    <div class="product-price">${formatRupiah(p.harga)}</div>
                `;
                card.addEventListener('click', () => addToCart(p));
                productGrid.appendChild(card);
            });
        }

        // ==================== CART ====================
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    ...product,
                    qty: 1,
                    id: product.id || (product.nama + product.size + Date.now())
                });
            }
            renderCart();
            showToast(`➕ ${product.nama} (${product.size}) ditambahkan`, 'info');
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                removeFromCart(id);
                return;
            }
            renderCart();
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('Kosongkan keranjang?')) {
                cart = [];
                renderCart();
                showToast('🗑️ Keranjang dikosongkan', 'info');
            }
        }

        function renderCart() {
            const count = cart.reduce((sum, i) => sum + i.qty, 0);
            const total = cart.reduce((sum, i) => sum + i.harga * i.qty, 0);
            cartCount.textContent = count;
            cartTotal.textContent = formatRupiah(total);

            cartItems.innerHTML = '';
            if (cart.length === 0) {
                cartItems.innerHTML =
                    `<div class="cart-empty"><span class="empty-icon">🧋</span> Belum ada pesanan.</div>`;
                btnCheckout.disabled = true;
                return;
            }

            cart.forEach(item => {
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">${item.nama}</div>
                        <div class="item-detail">${item.size} · Rp ${formatRupiah(item.harga)}</div>
                    </div>
                    <div class="item-qty">
                        <button data-action="dec" data-id="${item.id}">−</button>
                        <span class="qty-num">${item.qty}</span>
                        <button data-action="inc" data-id="${item.id}">+</button>
                    </div>
                    <div class="item-total">${formatRupiah(item.harga * item.qty)}</div>
                    <button class="btn-remove-item" data-id="${item.id}">✕</button>
                `;
                cartItems.appendChild(el);
            });

            cartItems.querySelectorAll('[data-action="inc"]').forEach(b => {
                b.addEventListener('click', () => updateQty(b.dataset.id, 1));
            });
            cartItems.querySelectorAll('[data-action="dec"]').forEach(b => {
                b.addEventListener('click', () => updateQty(b.dataset.id, -1));
            });
            cartItems.querySelectorAll('.btn-remove-item').forEach(b => {
                b.addEventListener('click', () => removeFromCart(b.dataset.id));
            });

            btnCheckout.disabled = false;
        }

        // ==================== CHECKOUT ====================
        async function checkout() {
            if (cart.length === 0) {
                showToast('⚠️ Keranjang kosong!', 'warning');
                return;
            }

            const total = cart.reduce((sum, i) => sum + i.harga * i.qty, 0);
            const items = cart.map(i => ({
                nama: i.nama,
                size: i.size,
                qty: i.qty,
                harga: i.harga,
            }));

            const payload = {
                items,
                total,
                paymentMethod,
                kasir: 'Kasir',
                catatan: '',
            };

            const res = await apiCall('addTransaction', payload);
            if (res.success) {
                showToast(`✅ Transaksi berhasil! Total Rp ${formatRupiah(total)} (${paymentMethod})`, 'success');
                cart = [];
                renderCart();
            } else {
                showToast('❌ Gagal transaksi: ' + res.message, 'error');
            }
        }

        // ==================== OWNER: TAMBAH PRODUK ====================
        async function saveNewProduct() {
            const password = ownerPassword.value.trim();
            const kategori = newCategory.value.trim();
            const nama = newName.value.trim();
            const size = newSize.value.trim();
            const harga = parseInt(newPrice.value);
            const stok = parseInt(newStock.value) || 0;

            if (!password) { showToast('⚠️ Masukkan password', 'warning'); return; }
            if (!kategori || !nama || !harga) {
                showToast('⚠️ Isi semua field (kategori, nama, harga)', 'warning');
                return;
            }

            const payload = {
                password,
                product: { kategori, nama, size, harga, stok }
            };

            const res = await apiCall('addProduct', payload);
            if (res.success) {
                showToast('✅ Produk berhasil ditambahkan!', 'success');
                ownerModal.classList.add('hidden');
                ownerPassword.value = '';
                newCategory.value = '';
                newName.value = '';
                newSize.value = '';
                newPrice.value = '';
                newStock.value = '0';
                loadProducts();
            } else {
                showToast('❌ Gagal: ' + res.message, 'error');
            }
        }

        // ==================== EVENT BINDING ====================
        dateBadge.textContent = '📅 ' + getToday();

        btnOwner.addEventListener('click', () => {
            ownerModal.classList.remove('hidden');
            ownerPassword.value = '';
            newCategory.value = '';
            newName.value = '';
            newSize.value = '';
            newPrice.value = '';
            newStock.value = '0';
            ownerPassword.focus();
        });

        modalClose.addEventListener('click', () => {
            ownerModal.classList.add('hidden');
        });

        modalSave.addEventListener('click', saveNewProduct);

        ownerModal.addEventListener('click', (e) => {
            if (e.target === ownerModal) ownerModal.classList.add('hidden');
        });

        paymentMethodEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            paymentMethodEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            paymentMethod = btn.dataset.method;
        });

        btnCheckout.addEventListener('click', checkout);
        btnClearCart.addEventListener('click', clearCart);

        // ==================== INIT ====================
        loadProducts();
    </script>

</body>
</html>
