<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kasir — Es Teh Djawa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');

  :root{
    --ink:#0f1d16;
    --paper:#f4f2ea;
    --card:#ffffff;

    --pine-950:#0c1f16;
    --pine-900:#12291d;
    --pine-800:#1b3826;
    --pine-700:#22452f;
    --pine-600:#2c5539;
    --pine-500:#3a6b47;
    --pine-100:#e2ebe0;
    --pine-50:#eef3ea;

    --gold:#c8973f;
    --gold-dark:#a5772a;
    --gold-light:#f5e9cf;

    --merah:#a8452f;
    --merah-light:#f5e2dc;
    --biru:#3a5f78;
    --biru-light:#e2ecf1;

    --line:#e2ddcc;
    --line-soft:#ece7d8;
    --muted:#786f5c;
    --muted-soft:#a39a86;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-card:0 1px 2px rgba(15,29,22,.04), 0 6px 20px rgba(15,29,22,.06);
    --shadow-float:0 10px 30px rgba(12,31,22,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px; overscroll-behavior-y:none;
  }
  ::selection{background:var(--pine-100);}

  /* ============ TOPBAR ============ */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:
      radial-gradient(circle at 12% -20%, rgba(200,151,63,.14), transparent 42%),
      linear-gradient(160deg, var(--pine-900), var(--pine-950));
    color:#f3ede0;
    padding:18px 18px 14px;
    box-shadow:0 4px 22px rgba(12,31,22,.30);
    border-bottom:1px solid rgba(243,237,224,.06);
  }
  .brandrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brandLeft{display:flex; align-items:center; gap:11px;}
  .leafBadge{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    background:linear-gradient(160deg, var(--pine-700), var(--pine-800));
    border:1px solid rgba(243,237,224,.14);
    display:flex; align-items:center; justify-content:center;
  }
  .leafBadge svg{width:20px;height:20px;}
  .brandLeft h1{font-family:"Fraunces",serif; font-size:18px; margin:0; font-weight:600; letter-spacing:.2px;}
  .brandLeft .sub{font-size:11px; color:rgba(243,237,224,.55); margin-top:2px; letter-spacing:.3px;}

  .headBtns{display:flex; align-items:center; gap:9px;}
  .iconBtn{
    background:rgba(243,237,224,.07); border:1px solid rgba(243,237,224,.14); color:#f3ede0;
    border-radius:10px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .15s; position:relative;
  }
  .iconBtn:active{background:rgba(243,237,224,.16);}
  .iconBtn svg{width:17px;height:17px;}
  .clockBox{text-align:right;}
  .clock{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.3px;}
  .dateSmall{font-size:9.5px; color:rgba(243,237,224,.5); text-transform:uppercase; letter-spacing:.5px; margin-top:1px;}

  .searchWrap{padding:15px 0 0; position:relative;}
  .searchWrap svg.sIcon{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:rgba(243,237,224,.45); pointer-events:none;}
  .searchWrap input{
    width:100%; padding:11px 14px 11px 38px; border-radius:12px; border:1px solid rgba(243,237,224,.16);
    background:rgba(243,237,224,.06); font-size:14px; color:#f3ede0; font-family:inherit;
  }
  .searchWrap input::placeholder{color:rgba(243,237,224,.42);}
  .searchWrap input:focus{outline:none; border-color:rgba(200,151,63,.55); background:rgba(243,237,224,.09);}

  .catTabs{display:flex; gap:7px; overflow-x:auto; padding:13px 0 2px; scrollbar-width:none;}
  .catTabs::-webkit-scrollbar{display:none;}
  .catTabs button{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid rgba(243,237,224,.16);
    background:transparent; font-size:12.5px; font-weight:600; color:rgba(243,237,224,.72); cursor:pointer; white-space:nowrap;
    letter-spacing:.1px; transition:all .15s;
  }
  .catTabs button.active{background:var(--gold); border-color:var(--gold); color:var(--pine-950); font-weight:700;}

  .topbar > .searchWrap, .topbar > .catTabs{padding-left:0; padding-right:0;}
  .topbar-inner{padding:0 0;}

  /* ============ MENU LIST ============ */
  .content{padding:0 18px;}
  .catLabelRow{display:flex; align-items:center; gap:10px; margin:22px 2px 11px;}
  .catLabel{font-family:"Fraunces",serif; font-size:15px; font-weight:600; color:var(--pine-900); white-space:nowrap;}
  .catRule{flex:1; height:1px; background:linear-gradient(90deg, var(--line), transparent);}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:11px;}
  .item{
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius-md);
    padding:14px; cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s;
    display:flex; flex-direction:column; gap:7px; position:relative; min-height:98px;
    box-shadow:var(--shadow-card);
  }
  .item:active{transform:scale(.965); box-shadow:none;}
  .item::before{
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0;
    background:var(--pine-600); opacity:0; transition:opacity .15s;
  }
  .item.has-qty::before{opacity:1;}
  .item.is-habis{opacity:.5; cursor:not-allowed;}
  .item.is-habis:active{transform:none;}
  .item .name{font-size:13.5px; font-weight:650; line-height:1.32; color:var(--ink);}
  .item .price{font-size:12.5px; color:var(--pine-700); margin-top:auto; font-weight:650;}
  .item .varCount{font-size:10px; color:var(--muted); font-weight:600; letter-spacing:.2px;}
  .item .habisTag{font-size:10px; color:var(--merah); font-weight:700; letter-spacing:.2px; text-transform:uppercase;}
  .item .qtyDot{
    position:absolute; top:9px; right:9px; min-width:21px; height:21px; padding:0 6px;
    background:var(--pine-800); color:#f3ede0; border-radius:999px; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(12,31,22,.25);
  }

  .empty{padding:60px 20px; text-align:center; color:var(--muted); font-size:14px;}
  .loadingBox{padding:70px 20px; text-align:center; color:var(--muted); font-size:13.5px;}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pine-700);border-radius:50%;margin:0 auto 14px;animation:spin .75s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============ VARIANT SHEET ============ */
  .sheetOverlay{position:fixed; inset:0; background:rgba(12,20,15,.5); backdrop-filter:blur(2px); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .sheetOverlay.show{display:flex;}
  .sheet{background:var(--paper); width:100%; max-width:520px; border-radius:22px 22px 0 0; max-height:86vh; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .22s cubic-bezier(.2,.8,.3,1); box-shadow:var(--shadow-float);}
  @keyframes slideUp{from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheetHandle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 2px;}
  .sheetHead{padding:12px 20px 10px; display:flex; align-items:flex-start; justify-content:space-between;}
  .sheetHead .ttl{font-family:"Fraunces",serif; font-size:18px; font-weight:600; color:var(--pine-950);}
  .sheetHead .cat{font-size:11.5px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.4px; font-weight:600;}
  .sheetHead button{background:var(--line-soft); border:none; width:30px; height:30px; border-radius:9px; font-size:16px; color:var(--muted); cursor:pointer;}
  .sheetBody{overflow-y:auto; padding:8px 20px 6px;}

  .varOption{
    display:flex; align-items:center; justify-content:space-between; padding:14px 15px; border:1px solid var(--line-soft);
    background:var(--card); border-radius:13px; margin-bottom:9px; cursor:pointer; transition:.13s; box-shadow:var(--shadow-card);
  }
  .varOption:active{transform:scale(.98);}
  .varOption.habis{opacity:.5; cursor:not-allowed;}
  .varOption.habis:active{transform:none;}
  .varOption .vn{font-size:14px; font-weight:650; color:var(--ink);}
  .varOption .vp{font-size:12.5px; color:var(--pine-700); margin-top:2px; font-weight:600;}
  .varOption .vhabis{font-size:11px; color:var(--merah); font-weight:700; margin-top:2px;}
  .varOption .plusBtn{
    width:34px; height:34px; border-radius:10px; background:var(--pine-900); color:#f3ede0;
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; flex:0 0 auto;
  }

  .qtyStepBar{display:flex; align-items:center; border:1px solid var(--pine-800); border-radius:11px; overflow:hidden; flex:0 0 auto; background:var(--pine-950);}
  .qtyStepBar button{width:32px; height:32px; border:none; background:transparent; font-size:17px; font-weight:700; color:#f3ede0; cursor:pointer;}
  .qtyStepBar .val{width:28px; text-align:center; font-size:13.5px; font-weight:700; color:#f3ede0;}

  /* ============ CART ============ */
  .cartOverlay{position:fixed; inset:0; background:rgba(12,20,15,.5); backdrop-filter:blur(2px); z-index:55; display:none; align-items:flex-end; justify-content:center;}
  .cartOverlay.show{display:flex;}
  .cartSheet{background:var(--paper); width:100%; max-width:520px; border-radius:22px 22px 0 0; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .22s cubic-bezier(.2,.8,.3,1); box-shadow:var(--shadow-float);}
  .cartHead{padding:14px 20px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line-soft);}
  .cartHead h2{font-family:"Fraunces",serif; font-size:17px; margin:0; font-weight:600; color:var(--pine-950);}
  .cartHead button{background:var(--line-soft); border:none; width:30px; height:30px; border-radius:9px; font-size:16px; color:var(--muted); cursor:pointer;}
  .cartBody{overflow-y:auto; padding:6px 20px;}

  .cartRow{display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:1px solid var(--line-soft);}
  .cartRow .ci{flex:1; min-width:0;}
  .cartRow .cn{font-size:13.5px; font-weight:650; line-height:1.32; color:var(--ink);}
  .cartRow .cv{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .cartRow .cp{font-size:12px; color:var(--pine-700); font-weight:650; margin-top:3px;}
  .cartRow .cstep{display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:0 0 auto;}
  .cartRow .cstep button{width:28px; height:28px; border:none; background:var(--pine-50); font-size:15px; font-weight:700; color:var(--pine-800); cursor:pointer;}
  .cartRow .cstep .cval{width:26px; text-align:center; font-size:13px; font-weight:700;}
  .cartRow .cdel{background:none; border:none; color:var(--merah); font-size:16px; cursor:pointer; padding:5px;}

  .catatanWrap{padding:14px 20px 0;}
  .catatanWrap label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; display:block;}
  .catatanWrap textarea{width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:13px; color:var(--ink); font-family:inherit; resize:none; min-height:44px;}
  .catatanWrap textarea:focus{outline:none; border-color:var(--pine-600);}

  .payWrap{padding:16px 20px 4px;}
  .payLabel{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:9px;}
  .payTabs{display:flex; gap:7px;}
  .payTabs button{
    flex:1; padding:12px 4px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:650; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    transition:all .15s;
  }
  .payTabs button.active{background:var(--pine-900); border-color:var(--pine-900); color:#f3ede0; box-shadow:0 4px 14px rgba(12,31,22,.22);}
  .payTabs button svg{width:16px;height:16px;}

  .nameWrap{padding:14px 20px 4px;}
  .nameWrap label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; display:block;}
  .nameWrap input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:14px; color:var(--ink); font-family:inherit;}
  .nameWrap input:focus{outline:none; border-color:var(--pine-600);}
  .nameWrap select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:14px; color:var(--ink); font-family:inherit; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23786f5c' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center; background-size:16px;}
  .nameWrap select:focus{outline:none; border-color:var(--pine-600);}
  .nameWrap .chipRow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .nameWrap .chipRow button{padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:11.5px; font-weight:600; color:var(--pine-700); cursor:pointer;}
  .nameWrap .modeHint{font-size:10.5px; color:var(--muted-soft); margin-top:6px;}

  .totalBar{padding:18px 20px 4px; display:flex; align-items:baseline; justify-content:space-between; border-top:1px dashed var(--line); margin-top:14px;}
  .totalBar .tl{font-size:12.5px; color:var(--muted); font-weight:650; text-transform:uppercase; letter-spacing:.4px;}
  .totalBar .tv{font-family:"Fraunces",serif; font-size:25px; font-weight:600; color:var(--pine-950);}

  .cartFoot{padding:16px 20px 22px;}
  .checkoutBtn{
    width:100%; background:linear-gradient(160deg, var(--pine-800), var(--pine-950)); color:#f3ede0; border:none; border-radius:14px;
    padding:16px; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:.2px;
    box-shadow:0 8px 22px rgba(12,31,22,.28);
  }
  .checkoutBtn[disabled]{opacity:.45; box-shadow:none;}
  .cartEmpty{padding:60px 20px; text-align:center; color:var(--muted); font-size:14px;}

  /* ============ FAB ============ */
  .fab{
    position:fixed; left:18px; right:18px; bottom:18px; z-index:40;
    background:linear-gradient(160deg, var(--pine-800), var(--pine-950)); color:#f3ede0; border:none; border-radius:16px;
    padding:16px 20px; font-size:15px; font-weight:700; box-shadow:var(--shadow-float);
    display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;
    border:1px solid rgba(243,237,224,.08);
  }
  .fab .fabLeft{display:flex; align-items:center; gap:10px;}
  .fab .badge{background:var(--gold); color:var(--pine-950); border-radius:999px; min-width:24px; height:24px; padding:0 8px; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .fab .fabTotal{font-variant-numeric:tabular-nums; letter-spacing:.2px;}
  .fab[disabled]{opacity:0; pointer-events:none;}

  /* ============ TOAST ============ */
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-74px);
    background:var(--pine-950); color:#f3ede0; padding:13px 22px; border-radius:13px; font-size:13.5px; font-weight:550;
    z-index:80; transition:transform .3s cubic-bezier(.2,.8,.3,1); box-shadow:0 10px 28px rgba(12,31,22,.35);
    max-width:88%; text-align:center; display:flex; align-items:center; gap:9px; border:1px solid rgba(243,237,224,.1);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;flex:0 0 auto; color:var(--gold);}
  .toast.err svg{color:#e2897a;}

  /* ============ MOTIVASI POP-UP ============ */
  .motivOverlay{position:fixed; inset:0; background:rgba(12,20,15,.45); backdrop-filter:blur(2px); z-index:70; display:none; align-items:center; justify-content:center; padding:22px;}
  .motivOverlay.show{display:flex;}
  .motivBox{
    background:linear-gradient(165deg, var(--pine-900), var(--pine-950)); color:#f3ede0; border-radius:20px; padding:26px 22px 22px;
    width:100%; max-width:340px; text-align:center; box-shadow:var(--shadow-float); border:1px solid rgba(243,237,224,.12);
    animation:popIn .25s cubic-bezier(.2,.8,.3,1); position:relative;
  }
  @keyframes popIn{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .motivBox .motivIcon{width:44px; height:44px; border-radius:13px; background:rgba(200,151,63,.16); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
  .motivBox .motivIcon svg{width:22px;height:22px; color:var(--gold);}
  .motivBox .motivText{font-family:"Fraunces",serif; font-size:16px; line-height:1.5; font-weight:500;}
  .motivBox .motivClose{
    margin-top:18px; background:rgba(243,237,224,.1); border:1px solid rgba(243,237,224,.18); color:#f3ede0;
    padding:9px 22px; border-radius:11px; font-size:12.5px; font-weight:650; cursor:pointer;
  }

  /* ============ ADMIN / PASSWORD ============ */
  .adminOverlay{position:fixed; inset:0; background:rgba(12,20,15,.55); backdrop-filter:blur(3px); z-index:60; display:none; align-items:center; justify-content:center; padding:20px;}
  .adminOverlay.show{display:flex;}
  .pwdBox{background:var(--card); border-radius:20px; padding:28px 24px; width:100%; max-width:340px; box-shadow:var(--shadow-float); border:1px solid var(--line-soft);}
  .pwdIconTop{width:46px; height:46px; border-radius:13px; background:var(--pine-900); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .pwdIconTop svg{width:22px;height:22px; color:var(--gold);}
  .pwdBox h3{font-family:"Fraunces",serif; font-size:18px; margin:0 0 4px; font-weight:600; color:var(--pine-950);}
  .pwdBox p{font-size:12.5px; color:var(--muted); margin:0 0 18px; line-height:1.5;}
  .pwdBox input{width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid var(--line); font-size:15px; margin-bottom:12px; letter-spacing:3px; font-family:inherit;}
  .pwdBox input:focus{outline:none; border-color:var(--pine-600);}
  .pwdBox .err{color:var(--merah); font-size:12px; margin:-6px 0 12px; display:none; font-weight:600;}
  .pwdBox .btnRow{display:flex; gap:9px;}
  .pwdBox button{flex:1; padding:12px; border-radius:11px; border:none; font-size:13.5px; font-weight:650; cursor:pointer; font-family:inherit;}
  .pwdBox .cancelB{background:var(--pine-50); color:var(--muted); border:1.5px solid var(--line);}
  .pwdBox .okB{background:var(--pine-950); color:#f3ede0;}

  .adminSheet{background:var(--paper); width:100%; max-width:520px; border-radius:22px 22px 0 0; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; animation:slideUp .22s cubic-bezier(.2,.8,.3,1); margin-top:auto; box-shadow:var(--shadow-float);}
  .adminHead{padding:16px 20px 13px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; justify-content:space-between;}
  .adminHead h2{font-family:"Fraunces",serif; font-size:17px; margin:0; font-weight:600; color:var(--pine-950);}
  .adminHead button{background:var(--line-soft); border:none; width:30px; height:30px; border-radius:9px; font-size:16px; color:var(--muted); cursor:pointer;}
  .adminBody{overflow-y:auto; padding:14px 20px 22px;}
  .addBtn{
    width:100%; background:var(--pine-50); color:var(--pine-800); border:1.5px dashed var(--pine-500); border-radius:13px;
    padding:14px; font-size:13.5px; font-weight:650; cursor:pointer; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:7px;
  }

  .adminTabs{display:flex; gap:7px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none;}
  .adminTabs::-webkit-scrollbar{display:none;}
  .adminTabs button{flex:0 0 auto; padding:9px 15px; border-radius:11px; border:1px solid var(--line); background:var(--card); font-size:12.5px; font-weight:650; color:var(--muted); cursor:pointer; white-space:nowrap;}
  .adminTabs button.active{background:var(--pine-900); border-color:var(--pine-900); color:#f3ede0;}

  .adminItem{background:var(--card); border:1px solid var(--line-soft); border-radius:13px; padding:13px 15px; margin-bottom:9px; box-shadow:var(--shadow-card);}
  .adminItem .aiTop{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .adminItem .ain{font-size:13.5px; font-weight:650; color:var(--ink);}
  .adminItem .aiv{font-size:11.5px; color:var(--muted); margin-top:7px; line-height:1.7;}
  .adminItem .aiBtns{display:flex; gap:6px; flex:0 0 auto;}

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZzIc_5_ljPvtEv-JGYXyLJfaAzpABgZHL_0T087VLJhVmSilqz4wUeqsPl1jZYBsj/exec";

let MENU = [];
let activeCat = "Semua";
let cart = {};
let payMethod = "Cash";
let adminPassword = "";
let pwdPurpose = "admin"; // "admin" atau "laporan"
let lapDataTerakhir = null;
let KARYAWAN_LIST = []; // daftar nama karyawan dari sheet "Nama karyawan"
let MOTIVASI_POOL = []; // daftar semua kalimat motivasi (diambil sekali, diacak lokal)
let motivIdx = 0;
let motivTimer = null;

const el = id => document.getElementById(id);
const rupiah = n => "Rp" + Number(n).toLocaleString('id-ID');
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

/* ===================== NAMA KARYAWAN ===================== */
// Sumber utama: sheet "Nama karyawan" (lewat backend). Kalau daftar itu kosong,
// baru boleh ketik manual (pakai daftar tersimpan di browser sebagai bantuan/chip).
function getKaryawanTerbaru(){
  try{ return JSON.parse(localStorage.getItem('etd_karyawan')||'[]'); }catch(e){ return []; }
}
function simpanKaryawan(nama){
  let list = getKaryawanTerbaru().filter(n=>n!==nama);
  list.unshift(nama);
  list = list.slice(0,5);
  try{ localStorage.setItem('etd_karyawan', JSON.stringify(list)); }catch(e){}
}

async function loadKaryawanList(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + "?action=getKaryawanList");
    const data = await res.json();
    if(data.status === 'ok' && Array.isArray(data.karyawan)) KARYAWAN_LIST = data.karyawan;
  }catch(e){ KARYAWAN_LIST = []; }
  renderKaryawanField();
}

// Render field nama karyawan: dropdown wajib pilih kalau daftar sheet ada isinya,
// atau input teks bebas (dibantu chip riwayat lokal) kalau daftar masih kosong.
function renderKaryawanField(){
  const area = el('karyawanFieldArea');
  if(KARYAWAN_LIST.length > 0){
    area.innerHTML = `
      <select id="karyawanName">
        <option value="" disabled selected>Pilih nama karyawan...</option>
        ${KARYAWAN_LIST.map(n=>`<option value="${n}">${n}</option>`).join('')}
      </select>
      <div class="modeHint">Nama diambil dari daftar karyawan di spreadsheet.</div>
    `;
  } else {
    area.innerHTML = `
      <input id="karyawanName" type="text" placeholder="Contoh: Sinta">
      <div class="chipRow" id="karyawanChips"></div>
      <div class="modeHint">Belum ada daftar nama karyawan di spreadsheet — boleh ketik manual dulu.</div>
    `;
    renderKaryawanChips();
  }
}
function renderKaryawanChips(){
  const chipEl = el('karyawanChips');
  if(!chipEl) return;
  const list = getKaryawanTerbaru();
  chipEl.innerHTML = list.map(n=>`<button type="button" data-n="${n}">${n}</button>`).join('');
  chipEl.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ el('karyawanName').value = b.dataset.n; };
  });
}
function getKaryawanValue(){
  const f = el('karyawanName');
  return f ? f.value.trim() : '';
}

/* ===================== MOTIVASI POP-UP ===================== */
async function loadMotivasiPool(){
  // Backend hanya mengirim 1 kalimat random per panggilan, jadi kita panggil beberapa kali
  // di awal untuk mengisi pool lokal, lalu bergilir setiap 3 menit tanpa spam ke server.
  try{
    const calls = [];
    for(let i=0;i<6;i++){ calls.push(fetch(APPS_SCRIPT_URL + "?action=getMotivasi").then(r=>r.json())); }
    const results = await Promise.all(calls);
    const set = new Set();
    results.forEach(r=>{ if(r.status==='ok' && r.motivasi) set.add(r.motivasi); });
    MOTIVASI_POOL = Array.from(set);
  }catch(e){ MOTIVASI_POOL = []; }
}

function jamSekarang(){ return new Date().getHours(); }

function tampilkanMotivasiBerikutnya(){
  if(jamSekarang() >= 21){
    el('motivText').textContent = "Terima kasih atas kerja kerasmu hari ini. Selamat beristirahat! 🙏";
    el('motivOverlay').classList.add('show');
    return;
  }
  if(MOTIVASI_POOL.length === 0) return; // belum ada data motivasi di sheet, jangan munculkan popup
  if(motivIdx >= MOTIVASI_POOL.length){
    // sudah semua tampil, acak ulang urutan dan mulai dari awal lagi
    MOTIVASI_POOL.sort(()=> Math.random()-0.5);
    motivIdx = 0;
  }
  el('motivText').textContent = MOTIVASI_POOL[motivIdx];
  motivIdx++;
  el('motivOverlay').classList.add('show');
}

function mulaiSiklusMotivasi(){
  // acak urutan awal
  MOTIVASI_POOL.sort(()=> Math.random()-0.5);
  motivIdx = 0;
  tampilkanMotivasiBerikutnya();
  if(motivTimer) clearInterval(motivTimer);
  motivTimer = setInterval(tampilkanMotivasiBerikutnya, 3*60*1000); // setiap 3 menit
}

el('motivClose').onclick = ()=> el('motivOverlay').classList.remove('show');
el('motivOverlay').onclick = (e)=>{ if(e.target.id==='motivOverlay') el('motivOverlay').classList.remove('show'); };

/* ===================== MENU ===================== */
async function loadMenu(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + "?action=getMenu");
    const data = await res.json();
    if(data.status !== 'ok') throw new Error(data.message);
    MENU = data.menu;
  }catch(e){
    el('menuArea').innerHTML = '<div class="empty">Gagal memuat menu. Pastikan APPS_SCRIPT_URL sudah diisi dan backend aktif.</div>';
    return;
  }
  renderCatTabs();
  renderMenu();
}

function renderCatTabs(){
  const tabs = el('catTabs');
  const cats = ["Semua", ...MENU.map(c=>c.kategori)];
  tabs.innerHTML = cats.map(c => `<button data-cat="${c}" class="${c===activeCat?'active':''}">${c}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ activeCat = b.dataset.cat; renderCatTabs(); renderMenu(); };
  });
}

function itemCartQty(ci, ii){
  const item = MENU[ci].items[ii];
  let total = 0;
  item.varian.forEach((v,vi)=>{ const k = ci+"|"+ii+"|"+vi; if(cart[k]) total += cart[k].qty; });
  return total;
}

function renderMenu(){
  if(MENU.length === 0){ el('menuArea').innerHTML = '<div class="empty">Belum ada menu. Tambahkan lewat tombol Kelola Menu.</div>'; return; }
  const q = el('searchBox').value.trim().toLowerCase();
  let html = '';
  MENU.forEach((cat, ci)=>{
    if(activeCat !== "Semua" && cat.kategori !== activeCat) return;
    const items = cat.items.map((it,ii)=>({it,ii})).filter(x => !q || x.it.nama.toLowerCase().includes(q));
    if(items.length===0) return;
    html += `<div class="catLabelRow"><div class="catLabel">${cat.kategori}</div><div class="catRule"></div></div><div class="grid">`;
    items.forEach(({it,ii})=>{
      const qty = itemCartQty(ci,ii);
      const semuaHabis = it.varian.every(v=>v.habis);
      const priceLabel = it.varian.length>1
        ? `Rp${Math.min(...it.varian.map(v=>v.harga||0)).toLocaleString('id-ID')}+`
        : `Rp${(it.varian[0].harga||0).toLocaleString('id-ID')}`;
      html += `<div class="item ${qty>0?'has-qty':''} ${semuaHabis?'is-habis':''}" data-ci="${ci}" data-ii="${ii}">
        ${qty>0 ? `<div class="qtyDot">${qty}</div>` : ''}
        <div class="name">${it.nama}</div>
        ${semuaHabis ? `<div class="habisTag">Habis</div>` : (it.varian.length>1 ? `<div class="varCount">${it.varian.length} pilihan</div>` : '')}
        <div class="price">${priceLabel}</div>
      </div>`;
    });
    html += `</div>`;
  });
  el('menuArea').innerHTML = html || '<div class="empty">Menu tidak ditemukan.</div>';
  el('menuArea').querySelectorAll('.item').forEach(card=>{
    card.onclick = ()=> openVariantSheet(+card.dataset.ci, +card.dataset.ii);
  });
}

function openVariantSheet(ci, ii){
  const cat = MENU[ci];
  const item = cat.items[ii];
  el('sheetTitle').textContent = item.nama;
  el('sheetCat').textContent = cat.kategori;
  el('sheetBody').innerHTML = item.varian.map((v, vi)=>{
    const k = ci+"|"+ii+"|"+vi;
    const qty = cart[k]?.qty || 0;
    if(v.habis){
      return `<div class="varOption habis">
        <div><div class="vn">${v.nama}</div><div class="vhabis">Sedang habis</div></div>
      </div>`;
    }
    if(qty > 0){
      return `<div class="varOption" style="cursor:default;">
        <div><div class="vn">${v.nama}</div><div class="vp">Rp${(v.harga||0).toLocaleString('id-ID')}</div></div>
        <div class="qtyStepBar" data-k="${k}"><button class="minus">−</button><div class="val">${qty}</div><button class="plus">+</button></div>
      </div>`;
    }
    return `<div class="varOption" data-k="${k}" data-add="1">
      <div><div class="vn">${v.nama}</div><div class="vp">Rp${(v.harga||0).toLocaleString('id-ID')}</div></div>
      <div class="plusBtn">+</div>
    </div>`;
  }).join('');
  attachSheetEvents(cat, item, ci, ii);
  el('sheetOverlay').classList.add('show');
}

function attachSheetEvents(cat, item, ci, ii){
  el('sheetBody').querySelectorAll('.varOption[data-add]').forEach(row=>{
    row.onclick = ()=>{
      const k = row.dataset.k; const vi = +k.split('|')[2]; const v = item.varian[vi];
      cart[k] = { nama:item.nama, varian:v.nama, harga:v.harga||0, kategori:cat.kategori, qty:1 };
      openVariantSheet(ci, ii); renderMenu(); updateFab();
    };
  });
  el('sheetBody').querySelectorAll('.qtyStepBar').forEach(bar=>{
    const k = bar.dataset.k;
    bar.querySelector('.plus').onclick = ()=>{ cart[k].qty++; openVariantSheet(ci, ii); renderMenu(); updateFab(); };
    bar.querySelector('.minus').onclick = ()=>{ cart[k].qty--; if(cart[k].qty<=0) delete cart[k]; openVariantSheet(ci, ii); renderMenu(); updateFab(); };
  });
}

el('sheetClose').onclick = ()=> el('sheetOverlay').classList.remove('show');
el('sheetOverlay').onclick = (e)=>{ if(e.target.id==='sheetOverlay') el('sheetOverlay').classList.remove('show'); };
el('searchBox').addEventListener('input', renderMenu);

function cartTotalRp(){ return Object.values(cart).reduce((s,c)=> s + c.qty*c.harga, 0); }
function cartTotalQty(){ return Object.values(cart).reduce((s,c)=> s + c.qty, 0); }

function updateFab(){
  const qty = cartTotalQty();
  const fab = el('fab');
  if(qty===0){ fab.disabled = true; }
  else{ fab.disabled = false; el('fabBadge').textContent = qty; el('fabTotal').textContent = rupiah(cartTotalRp()); }
}

el('fab').onclick = ()=> openCart();
function openCart(){ renderCartBody(); renderKaryawanField(); el('cartOverlay').classList.add('show'); }

function renderCartBody(){
  const keys = Object.keys(cart);
  if(keys.length===0){ el('cartBody').innerHTML = '<div class="cartEmpty">Keranjang masih kosong.</div>'; }
  else {
    el('cartBody').innerHTML = keys.map(k=>{
      const c = cart[k];
      return `<div class="cartRow" data-k="${k}">
        <div class="ci"><div class="cn">${c.nama}</div><div class="cv">${c.varian}</div><div class="cp">${rupiah(c.harga)}</div></div>
        <div class="cstep"><button class="cminus">−</button><div class="cval">${c.qty}</div><button class="cplus">+</button></div>
        <button class="cdel"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>
      </div>`;
    }).join('');
    el('cartBody').querySelectorAll('.cartRow').forEach(row=>{
      const k = row.dataset.k;
      row.querySelector('.cplus').onclick = ()=>{ cart[k].qty++; renderCartBody(); renderMenu(); updateFab(); };
      row.querySelector('.cminus').onclick = ()=>{ cart[k].qty--; if(cart[k].qty<=0) delete cart[k]; renderCartBody(); renderMenu(); updateFab(); };
      row.querySelector('.cdel').onclick = ()=>{ delete cart[k]; renderCartBody(); renderMenu(); updateFab(); };
    });
  }
  el('cartTotal').textContent = rupiah(cartTotalRp());
}

el('cartClose').onclick = ()=> el('cartOverlay').classList.remove('show');
el('cartOverlay').onclick = (e)=>{ if(e.target.id==='cartOverlay') el('cartOverlay').classList.remove('show'); };

function showToast(msg, ok=true){
  const t = el('toast');
  t.classList.toggle('err', !ok);
  t.innerHTML = (ok ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.7 3.86a2 2 0 00-3.4 0z"/></svg>') + '<span>'+msg+'</span>';
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2800);
}

el('checkoutBtn').onclick = async ()=>{
  const nama = getKaryawanValue();
  if(!nama){ showToast("Pilih/isi nama karyawan dulu ya", false); return; }
  const keys = Object.keys(cart);
  if(keys.length===0) return;
  const btn = el('checkoutBtn'); btn.disabled = true; btn.textContent = "Mengirim...";
  const payload = {
    action: "checkout", karyawan: nama, metodeBayar: payMethod, waktu: new Date().toISOString(), total: cartTotalRp(),
    catatan: el('catatanOrder').value.trim(),
    items: keys.map(k => ({ nama: cart[k].nama, varian: cart[k].varian, harga: cart[k].harga, qty: cart[k].qty, kategori: cart[k].kategori, subtotal: cart[k].qty*cart[k].harga }))
  };
  try{
    if(APPS_SCRIPT_URL.includes("PASTE_URL")){ showToast("URL Apps Script belum diatur", false); }
    else {
      await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
      showToast("Pesanan terkirim — " + rupiah(payload.total));
      if(KARYAWAN_LIST.length === 0) simpanKaryawan(nama); // hanya perlu chip riwayat kalau masih mode ketik manual
    }
    cart = {}; el('catatanOrder').value = ''; payMethod = 'Cash';
    el('payTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active', x.dataset.pay==='Cash'));
    el('cartOverlay').classList.remove('show'); renderMenu(); updateFab();
  }catch(err){ showToast("Gagal mengirim. Cek koneksi internet.", false); }
  finally{ btn.disabled = false; btn.textContent = "Selesai & Kirim Pesanan"; }
};

function renderAdminList(){
  let html = `<button class="addBtn" id="addNewBtn">

            <button class="delB" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>
          </div>

  el('adminBody').querySelectorAll('.adminItem').forEach(rowEl=>{
    const ci = +rowEl.dataset.ci, ii = +rowEl.dataset.ii;
    rowEl.querySelector('[data-act="edit"]').onclick = ()=> openAdminForm({ci, ii});
    rowEl.querySelector('[data-act="delete"]').onclick = ()=> confirmDelete(ci, ii);

async function toggleHabisItem(ci, ii){
  const cat = MENU[ci], item = cat.items[ii];
  const habisSekarang = item.varian.every(v=>v.habis);
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({
      action:"toggleHabis", password: adminPassword, kategori: cat.kategori, nama: item.nama, varianNama: null, habis: !habisSekarang
    })});
    const data = await res.json();
    if(data.status !== 'ok'){ showToast(data.message || "Gagal mengubah status", false); return; }
    MENU = data.menu;
    showToast(habisSekarang ? "Menu ditandai tersedia lagi" : "Menu ditandai habis");
    renderMenu(); renderAdminList();
  }catch(e){ showToast("Gagal mengubah status. Cek koneksi.", false); }
}

function openAdminForm(target){
  const cat = target ? MENU[target.ci] : null;
  const item = target ? cat.items[target.ii] : null;

  const kategoriVal = item ? cat.kategori : '';
  const namaVal = item ? item.nama : '';
  const varianList = item ? item.varian.map(v=>({nama:v.nama, harga:v.harga})) : [{nama:'Reguler', harga:0}];

  let html = `<button class="backLink" id="backToList">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      Kembali
    </button>
    <div class="formField"><label>Kategori</label><input id="fKategori" type="text" value="${kategoriVal}" placeholder="Contoh: Es Teh Manis"></div>
    <div class="formField"><label>Nama Menu</label><input id="fNama" type="text" value="${namaVal}" placeholder="Contoh: Es Teh Lemon"></div>
    <div class="formField"><label>Varian & Harga</label><div id="varList"></div>
      <button class="addVarBtn" id="addVarBtn">+ Tambah varian</button>
    </div>
    <button class="saveFormBtn" id="saveFormBtn">${target ? 'Simpan Perubahan' : 'Tambah Menu'}</button>`;

  el('adminBody').innerHTML = html;
  el('backToList').onclick = ()=> renderAdminList();

  function renderVarList(){
    el('varList').innerHTML = varianList.map((v,i)=>`
      <div class="varRow" data-i="${i}">
        <input class="vNama" type="text" value="${v.nama}" placeholder="Nama varian">
        <input class="vHarga" type="number" value="${v.harga}" placeholder="Harga" style="max-width:110px;">
        ${varianList.length>1 ? `<button class="rmVar">✕</button>` : ''}
      </div>`).join('');
    el('varList').querySelectorAll('.varRow').forEach(row=>{
      const i = +row.dataset.i;
      row.querySelector('.vNama').oninput = e=> varianList[i].nama = e.target.value;
      row.querySelector('.vHarga').oninput = e=> varianList[i].harga = Number(e.target.value)||0;
      const rm = row.querySelector('.rmVar');
      if(rm) rm.onclick = ()=>{ varianList.splice(i,1); renderVarList(); };
    });
  }
  renderVarList();
  el('addVarBtn').onclick = ()=>{ varianList.push({nama:'', harga:0}); renderVarList(); };

  el('saveFormBtn').onclick = async ()=>{
    const kategori = el('fKategori').value.trim();
    const nama = el('fNama').value.trim();
    if(!kategori || !nama){ showToast("Isi kategori dan nama menu dulu", false); return; }
    const validVarian = varianList.filter(v=>v.nama.trim());
    if(validVarian.length===0){ showToast("Isi minimal 1 varian", false); return; }

    const btn = el('saveFormBtn'); btn.disabled = true; btn.textContent = "Menyimpan...";
    try{
      let payload;
      if(target){
        payload = { action:"editItem", password: adminPassword, oldKategori: cat.kategori, oldNama: item.nama, kategori, nama, varian: validVarian };
      } else {
        payload = { action:"addItem", password: adminPassword, kategori, nama, varian: validVarian };
      }
      const res = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
      const data = await res.json();
      if(data.status !== 'ok'){ showToast(data.message || "Gagal menyimpan", false); btn.disabled=false; btn.textContent = target?'Simpan Perubahan':'Tambah Menu'; return; }
      MENU = data.menu;
      showToast(target ? "Menu diperbarui" : "Menu ditambahkan");
      renderCatTabs(); renderMenu();
      renderAdminList();
    }catch(e){
      showToast("Gagal menyimpan. Cek koneksi.", false);
      btn.disabled = false; btn.textContent = target?'Simpan Perubahan':'Tambah Menu';
    }
  };
}

function confirmDelete(ci, ii){
  const cat = MENU[ci], item = cat.items[ii];
  if(!confirm(`Hapus "${item.nama}" dari menu?`)) return;
  (async ()=>{
    try{
      const res = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({ action:"deleteItem", password: adminPassword, kategori: cat.kategori, nama: item.nama }) });
      const data = await res.json();
      if(data.status !== 'ok'){ showToast(data.message || "Gagal menghapus", false); return; }
      MENU = data.menu;
      showToast("Menu dihapus");
      renderCatTabs(); renderMenu(); renderAdminList();
    }catch(e){ showToast("Gagal menghapus. Cek koneksi.", false); }
  })();
}

    </div>
  `;

  if(data.perShift && data.perShift.length){
    html += `<div class="lapSection"><h4>Penjualan per Shift (09.00–21.00)</h4><div class="shiftGrid">`;
    data.perShift.forEach(s=>{
      html += `<div class="shiftCard">
        <div class="scLbl">${SHIFT_ICON[s.shift]||''} ${s.shift}</div>
        <div class="scVal">${rupiah(s.total)}</div>
        <div class="scSub">${s.jumlahTrx} transaksi · ${s.jumlahItem} item</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  if(data.perKaryawan && data.perKaryawan.length){
    html += `<div class="lapSection"><h4>Penjualan per Karyawan</h4>`;
    data.perKaryawan.forEach(k=>{
      html += `<div class="lapRow"><div class="lrn">${k.karyawan}</div><div class="lrv">${rupiah(k.total)}</div></div>`;
    });
    html += `</div>`;
  }

  if(data.itemTerlaris && data.itemTerlaris.length){
    html += `<div class="lapSection"><h4>Menu Terlaris</h4>`;
    data.itemTerlaris.slice(0,10).forEach(it=>{
      html += `<div class="lapRow"><div><div class="lrn">${it.nama}</div><div class="lrq">${it.qty} terjual</div></div><div class="lrv">${rupiah(it.subtotal)}</div></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="lapSection"><h4>Riwayat Transaksi (${data.transaksi.length})</h4><div id="trxList"></div></div>`;

  el('lapBody').innerHTML = html;

  if(data.transaksi.length === 0){
    el('trxList').innerHTML = '<div class="empty" style="padding:24px 0;">Belum ada transaksi hari ini.</div>';
  } else {
    el('trxList').innerHTML = data.transaksi.map(t=>`
      <div class="trxRow" data-id="${t.trxId}">
        <div><div class="trn">${t.karyawan} · ${t.metode}</div><div class="trm">${t.waktu} · ${t.jumlahItem} item</div></div>
        <div style="display:flex; align-items:center;">
          <div class="trv">${rupiah(t.total)}</div>
          <button class="voidB" title="Batalkan transaksi ini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>
        </div>
      </div>`).join('');
    el('trxList').querySelectorAll('.trxRow').forEach(row=>{
      row.querySelector('.voidB').onclick = ()=> voidTransaksi(row.dataset.id);
    });
  }

  el('shareWaBtn').onclick = ()=> bagikanLaporanWA(data);
  el('downloadTxtBtn').onclick = ()=> unduhLaporan(data);
}

async function voidTransaksi(trxId){
  if(!confirm("Batalkan transaksi ini? Data akan dihapus dari laporan.")) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({ action:"voidTransaksi", password: "", trxId }) });
    const data = await res.json();
    if(data.status !== 'ok'){ showToast(data.message || "Gagal membatalkan transaksi", false); return; }
    showToast("Transaksi dibatalkan");
    muatLaporanTanggal(lapTanggalAktif);
  }catch(e){ showToast("Gagal membatalkan. Cek koneksi.", false); }
}

function susunTeksLaporan(data){
  const r = data.ringkasan;
  let t = `*LAPORAN PENJUALAN — ES TEH DJAWA*\n`;
  t += `Tanggal: ${tanggalIndo(data.tanggal)}\n`;
  t += `------------------------------\n`;
  t += `Total Penjualan: ${rupiah(r.total)}\n`;
  t += `Jumlah Transaksi: ${r.jumlahTrx}\n`;
  t += `Item Terjual: ${r.jumlahItem}\n\n`;
  t += `*Metode Bayar*\n`;
  t += `Cash: ${rupiah(r.cash)}\n`;
  t += `QRIS: ${rupiah(r.qris)}\n`;
  t += `Transfer: ${rupiah(r.transfer)}\n\n`;
  if(data.perShift && data.perShift.length){
    t += `*Per Shift*\n`;
    data.perShift.forEach(s=>{ t += `${s.shift}: ${rupiah(s.total)} (${s.jumlahTrx} trx)\n`; });
    t += `\n`;
  }
  if(data.perKaryawan && data.perKaryawan.length){
    t += `*Per Karyawan*\n`;
    data.perKaryawan.forEach(k=>{ t += `${k.karyawan}: ${rupiah(k.total)}\n`; });
    t += `\n`;
  }
  if(data.itemTerlaris && data.itemTerlaris.length){
    t += `*Menu Terlaris*\n`;
    data.itemTerlaris.slice(0,10).forEach((it,idx)=>{ t += `${idx+1}. ${it.nama} — ${it.qty}x (${rupiah(it.subtotal)})\n`; });
    t += `\n`;
  }
  t += `------------------------------\n`;
  t += `Dibuat otomatis dari Kasir Es Teh Djawa`;
  return t;
}

async function bagikanLaporanWA(data){
  const teks = susunTeksLaporan(data);
  const fileName = `Laporan-EsTehDjawa-${data.tanggal}.txt`;
  const blob = new Blob([teks], { type: 'text/plain' });
  const file = new File([blob], fileName, { type: 'text/plain' });

  // Coba pakai Web Share API (bisa langsung kirim FILE ke WhatsApp di HP)
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: 'Laporan Penjualan', text: teks });
      return;
    }catch(e){ /* user membatalkan / gagal, lanjut ke fallback */ }
  }
  // Fallback: buka WhatsApp dengan teks laporan langsung (tanpa file terlampir)
  const url = "https://wa.me/?text=" + encodeURIComponent(teks);
  window.open(url, '_blank');
  showToast("Perangkat ini tidak mendukung kirim file langsung — teks laporan dibuka di WhatsApp");
}

function unduhLaporan(data){
  const teks = susunTeksLaporan(data);
  const fileName = `Laporan-EsTehDjawa-${data.tanggal}.txt`;
  const blob = new Blob([teks], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Laporan diunduh: " + fileName);
}
